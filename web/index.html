<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <title>Jarvis</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div id="gate" class="gate">
      <form class="gate-card" id="gate-form">
        <h1>JARVIS</h1>
        <p>Enter your access token to connect to this PC.</p>
        <input
          id="gate-token"
          type="password"
          autocomplete="current-password"
          placeholder="Access token"
          required
        />
        <button type="submit">Connect</button>
        <p class="gate-error" id="gate-error" hidden></p>
      </form>
    </div>

    <div id="app" class="app" hidden>
      <header class="topbar">
        <div class="brand">
          <span class="logo">J</span>
          <div>
            <strong>JARVIS</strong>
            <span class="host" id="host">—</span>
          </div>
        </div>
        <div class="status">
          <span class="dot" id="status-dot"></span>
          <span id="status-text">connecting</span>
          <button class="icon-btn" id="logout" title="Disconnect">⏻</button>
        </div>
      </header>

      <section class="metrics" id="metrics">
        <div class="metric" data-key="cpu">
          <div class="metric-head"><span>CPU</span><b id="cpu-val">—</b></div>
          <div class="bar"><i id="cpu-bar"></i></div>
        </div>
        <div class="metric" data-key="ram">
          <div class="metric-head"><span>RAM</span><b id="ram-val">—</b></div>
          <div class="bar"><i id="ram-bar"></i></div>
        </div>
        <div class="metric" data-key="disk">
          <div class="metric-head"><span>DISK</span><b id="disk-val">—</b></div>
          <div class="bar"><i id="disk-bar"></i></div>
        </div>
        <div class="metric" data-key="battery">
          <div class="metric-head"><span>BATTERY</span><b id="bat-val">—</b></div>
          <div class="bar"><i id="bat-bar"></i></div>
        </div>
      </section>

      <main class="main">
        <section class="chat-pane">
          <div class="messages" id="messages">
            <div class="msg assistant">
              <div class="bubble">
                Jarvis online. Ask me about your PC — try
                <em>"how is my PC doing?"</em> or
                <em>"what's using the most memory?"</em>
              </div>
            </div>
          </div>
          <form class="composer" id="composer">
            <input
              id="input"
              type="text"
              placeholder="Ask Jarvis…"
              autocomplete="off"
            />
            <button type="submit" id="send">Send</button>
          </form>
        </section>

        <aside class="side">
          <h2>Recent tool activity</h2>
          <ul class="activity" id="activity">
            <li class="empty">No tool calls yet.</li>
          </ul>
        </aside>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
