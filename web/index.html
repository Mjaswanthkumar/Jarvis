<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <title>Jarvis</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jarvis" />
    <link rel="stylesheet" href="/static/style.css?v=11" />
  </head>
  <body>
    <div id="gate" class="gate">
      <form class="gate-card" id="gate-form">
        <h1>JARVIS</h1>
        <p>Enter your access token to connect to this PC.</p>
        <p class="gate-hint" id="gate-hint" hidden>Pairing from the QR code…</p>
        <input
          id="gate-token"
          type="password"
          autocomplete="current-password"
          placeholder="Access token"
          required
        />
        <button type="submit">Connect</button>
        <p class="gate-error" id="gate-error" hidden></p>
      </form>
    </div>

    <div id="app" class="app" hidden>
      <header class="topbar">
        <div class="brand">
          <button class="icon-btn menu" id="menu" title="Conversations" aria-label="Conversations">☰</button>
          <span class="logo">J</span>
          <div>
            <strong>JARVIS</strong>
            <span class="host" id="host">—</span>
          </div>
        </div>
        <div class="status">
          <span class="dot" id="status-dot"></span>
          <span id="status-text">connecting</span>
          <button
            class="icon-btn"
            id="speak-toggle"
            title="Speak replies aloud"
            aria-pressed="false"
          >
            🔈
          </button>
          <button class="icon-btn" id="new-chat" title="New conversation" aria-label="New conversation">✚</button>
          <button class="icon-btn" id="logout" title="Disconnect">⏻</button>
        </div>
      </header>

      <button class="metrics-toggle" id="metrics-toggle" aria-expanded="true">
        Vitals
      </button>

      <section class="metrics" id="metrics">
        <div class="metric" data-key="cpu">
          <div class="metric-head"><span>CPU</span><b id="cpu-val">—</b></div>
          <div class="bar"><i id="cpu-bar"></i></div>
          <svg class="spark" id="cpu-spark" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
        <div class="metric" data-key="ram">
          <div class="metric-head"><span>RAM</span><b id="ram-val">—</b></div>
          <div class="bar"><i id="ram-bar"></i></div>
          <svg class="spark" id="ram-spark" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
        <div class="metric" data-key="disk">
          <div class="metric-head"><span>DISK</span><b id="disk-val">—</b></div>
          <div class="bar"><i id="disk-bar"></i></div>
          <svg class="spark" id="disk-spark" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
        <div class="metric" data-key="battery">
          <div class="metric-head"><span>BATTERY</span><b id="bat-val">—</b></div>
          <div class="bar"><i id="bat-bar"></i></div>
          <svg class="spark" id="bat-spark" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
      </section>

      <main class="main">
        <section class="chat-pane">
          <div class="messages" id="messages"></div>
          <div class="voice-status" id="voice-status" hidden>
            <span class="pulse"></span>
            <span id="voice-text">Listening…</span>
          </div>
          <form class="composer" id="composer">
            <button
              type="button"
              class="mic"
              id="mic"
              title="Hold a conversation by voice"
              aria-label="Speak to Jarvis"
              hidden
            >
              🎙
            </button>
            <input
              id="input"
              type="text"
              placeholder="Ask Jarvis…"
              autocomplete="off"
            />
            <button type="submit" id="send">Send</button>
          </form>
        </section>

        <aside class="side" id="side">
          <h2>Recent tool activity</h2>
          <ul class="activity" id="activity">
            <li class="empty">No tool calls yet.</li>
          </ul>
        </aside>
      </main>

      <div class="scrim" id="drawer-scrim" hidden></div>
      <nav class="drawer" id="drawer" hidden aria-label="Conversations">
        <div class="panel-head">
          <strong>Conversations</strong>
          <button class="icon-btn" id="drawer-close" aria-label="Close">✕</button>
        </div>
        <button class="panel-action" id="drawer-new">✚ New conversation</button>
        <ul class="conversations" id="conversations"></ul>
      </nav>

      <div class="scrim" id="sheet-scrim" hidden></div>
      <section class="sheet" id="sheet" hidden aria-label="What Jarvis can do">
        <div class="panel-head">
          <strong>What Jarvis can do</strong>
          <button class="icon-btn" id="sheet-close" aria-label="Close">✕</button>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
      </section>
    </div>

    <script src="/static/markdown.js?v=11"></script>
    <script src="/static/voice.js?v=11"></script>
    <script src="/static/app.js?v=11"></script>
  </body>
</html>
